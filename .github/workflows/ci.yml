# Tests + cache warmer on the default branch.
#
# Two jobs in one:
#
# 1. Checks: frontend build + vitest, the propose.py rules regression, the
#    Rust unit tests, and clippy. Runs on every PR and push to main.
#
# 2. Cache warmer: the release workflow runs on tags, and tag-triggered runs
#    can only restore caches saved from the DEFAULT branch. This job compiles
#    src-tauri in release mode on each push to main and saves the cache under
#    the same `shared-key` release.yml uses, so releases restore the compiled
#    DuckDB + deps instead of rebuilding them (~25 min -> a few min once warm).
#    The weekly `schedule` keeps that cache alive: GitHub evicts caches not
#    accessed for 7 days, and releases are roughly monthly.
#
# release.yml refuses to build a tag whose commit has no successful run of
# this workflow, which also guarantees the cache for that exact commit has
# been saved before the release starts.
#
# windows-latest matches the release runner so the cached artifacts apply.
# The Rust toolchain comes from rust-toolchain.toml (pinned, so the cache key
# doesn't change every time a new stable ships).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 09:17 UTC. Refreshes the main-branch cache's last-access time.
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup Rust (from rust-toolchain.toml)
        # rustup is preinstalled on GitHub's Windows images; with no argument
        # `rustup toolchain install` installs the toolchain + components named
        # in rust-toolchain.toml.
        run: |
          rustup toolchain install
          rustc --version
          cargo clippy --version

      - name: Cache cargo registry/build
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri -> target
          shared-key: "barrekeep" # must match release.yml
          # Only the default branch writes the shared cache; PR runs restore it
          # read-only so a branch can't overwrite it with its own artifacts.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Frontend tests (vitest)
        run: npm test

      - name: propose.py rules regression
        run: python scripts/tests/test_propose_rules.py

      - name: Release smoke-test script (against the repo layout)
        # release.yml runs this against the installed MSI; running it here on
        # the repo (same scripts/ + prompts/ layout) keeps the script itself
        # exercised on Windows between releases.
        run: python scripts/tests/smoke_installed.py .

      - name: Compile Rust (release) — warms the DuckDB/deps cache
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        # --release so the test build reuses the release-profile DuckDB/deps
        # artifacts compiled (and cached) above instead of a second debug build.
        #
        # --test-threads=1: the duckdb crate is built without its `json`
        # feature, so each test's migrations autoload (download + install)
        # the json extension into ~/.duckdb/extensions. Parallel tests race
        # on that install and Windows fails the file move ("Could not move
        # file: Access is denied"). The suite takes seconds either way.
        run: cargo test --release --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Clippy
        # Non-blocking for now: 6 known lints remain in commands.rs /
        # algorithm.rs, which a follow-up PR is rewriting. Drop
        # continue-on-error once that lands and clippy is clean.
        continue-on-error: true
        run: cargo clippy --release --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
